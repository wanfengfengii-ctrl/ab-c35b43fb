name: maintenance-windows

services:
  app:
    build: .
    image: maintenance-windows-app
    ports:
      # Host port is configurable: APP_HOST_PORT=9090 docker compose up app
      - "${APP_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # One-shot gate: runs unit tests, a build check and DST-boundary HTTP smoke
  # against a cleanly started app, then exits with the verdict as exit code.
  #   docker compose up --build --exit-code-from verify
  verify:
    image: maintenance-windows-app
    build: .
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_BASE_URL: http://app:8080
    command: ["python", "verify.py"]
    restart: "no"
